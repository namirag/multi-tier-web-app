services:

  mysql:
    image: mysql:8
    container_name: mysql_db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: shop

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  backend:
    build: ./backend
    container_name: flask_backend
    restart: always

    ports:
      - "5000:5000"

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: admin123
      DB_NAME: shop

    depends_on:
      - mysql


  frontend:
    build: ./frontend
    container_name: frontend_app
    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend


volumes:
  mysql_data: